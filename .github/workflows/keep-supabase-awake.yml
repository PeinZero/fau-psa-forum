name: Keep Supabase awake

on:
  schedule:
    # Every 3 days (the day-of-month step restarts each month, so gaps never exceed 4 days).
    - cron: "17 6 */3 * *"
  workflow_dispatch:
  # Checks the setup whenever this file changes, so a broken edit shows up in its own PR.
  pull_request:
    paths: [".github/workflows/keep-supabase-awake.yml"]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The secrets live in this GitHub environment, not at repository level.
    environment: wake up call for superbase
    steps:
      - name: Read one row through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY environment secrets (see docs/deployment.md)."
            exit 1
          fi
          # A failure fails the run, and GitHub emails the people watching workflow failures.
          body=$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1")
          echo "$body" | grep -q '"id"' || { echo "::error::Unexpected response: $body"; exit 1; }
          echo "Supabase answered with a row; the project stays active."
